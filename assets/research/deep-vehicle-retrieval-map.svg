<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Four families in deep vehicle retrieval</title>
  <desc id="desc">A review organizes vehicle-retrieval systems into four expanding groups: feature learning, metric learning, post-processing, and data preparation.</desc>
  <rect width="900" height="330" rx="18" fill="#f1efe8"/>
  <text x="34" y="38" fill="#77766e" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">A REVIEW’S TAXONOMY · EACH STAGE ADDS A TOOL</text>
  <path d="M95 111H805" stroke="#c9c3b5" stroke-width="2"/>
  <path d="m798 105 8 6-8 6" fill="none" stroke="#a47b3d" stroke-width="2"/>
  <g font-family="Arial,sans-serif">
    <circle cx="112" cy="111" r="21" fill="#d9cfb5"/><text x="106" y="116" fill="#282924" font-size="13" font-weight="700">1</text>
    <rect x="34" y="151" width="190" height="126" rx="10" fill="#fffdf7" stroke="#c9c3b5"/><text x="52" y="180" fill="#a47b3d" font-size="11" font-weight="700" letter-spacing="1">FEATURES</text><text x="52" y="207" fill="#282924" font-size="16" font-weight="700">Learn what’s visible</text><text x="52" y="233" fill="#77766e" font-size="12">CNNs or transformers</text><text x="52" y="253" fill="#77766e" font-size="12">encode vehicle images.</text>
    <circle cx="337" cy="111" r="21" fill="#d9cfb5"/><text x="331" y="116" fill="#282924" font-size="13" font-weight="700">2</text>
    <rect x="246" y="151" width="190" height="126" rx="10" fill="#fffdf7" stroke="#c9c3b5"/><text x="264" y="180" fill="#a47b3d" font-size="11" font-weight="700" letter-spacing="1">+ METRIC LEARNING</text><text x="264" y="207" fill="#282924" font-size="16" font-weight="700">Shape the ranking</text><text x="264" y="233" fill="#77766e" font-size="12">Pull same-identity features</text><text x="264" y="253" fill="#77766e" font-size="12">closer; push others apart.</text>
    <circle cx="562" cy="111" r="21" fill="#d9cfb5"/><text x="556" y="116" fill="#282924" font-size="13" font-weight="700">3</text>
    <rect x="458" y="151" width="190" height="126" rx="10" fill="#fffdf7" stroke="#c9c3b5"/><text x="476" y="180" fill="#a47b3d" font-size="11" font-weight="700" letter-spacing="1">+ POST-PROCESSING</text><text x="476" y="207" fill="#282924" font-size="16" font-weight="700">Refine results</text><text x="476" y="233" fill="#77766e" font-size="12">Re-ranking or tracklet</text><text x="476" y="253" fill="#77766e" font-size="12">context can adjust order.</text>
    <circle cx="787" cy="111" r="21" fill="#d9cfb5"/><text x="781" y="116" fill="#282924" font-size="13" font-weight="700">4</text>
    <rect x="670" y="151" width="196" height="126" rx="10" fill="#e7e3d8" stroke="#c9c3b5"/><text x="688" y="180" fill="#a47b3d" font-size="11" font-weight="700" letter-spacing="1">+ DATA PREPARATION</text><text x="688" y="207" fill="#282924" font-size="16" font-weight="700">Address data gaps</text><text x="688" y="233" fill="#77766e" font-size="12">Crop, augment, or adapt</text><text x="688" y="253" fill="#77766e" font-size="12">before learning features.</text>
  </g>
  <text x="34" y="308" fill="#77766e" font-family="Arial,sans-serif" font-size="12">More stages add complexity. The paper is a survey, not a claim that every system needs all four.</text>
</svg>
